name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

env:
    DOTNET_VERSION: '10.0.x'

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore apps/api/RepFrame.Api.sln

            - name: Build
              run: dotnet build apps/api/RepFrame.Api.sln --no-restore --configuration Release

            - name: Test
              run: dotnet test apps/api/RepFrame.Api.sln --no-build --configuration Release --verbosity normal
